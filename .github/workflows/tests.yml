name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: System audio deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
      - name: System audio deps (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install test deps (no basic-pitch / onnx / yt-dlp)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip check
      - name: Unit tests (Live port guarded; catalogue tests skip with a reason)
        run: python -m unittest discover -s tests -t . --durations 15
